[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "botkit"
version = "0.1.0"
description = "Каркас фреймворка для сборки образовательных ботов на базе LLM — по спецификации docs/Модули фреймворка — приоритет.md"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<0.29",
    "python-dotenv>=1,<2",
    "nltk>=3.8",
    "pdfplumber>=0.11",
    "python-docx>=1.2,<2",
    "pypdfium2>=5.13,<6",
    "Pillow>=12,<13",
    "defusedxml>=0.7,<1",
    "chromadb>=1.0",
    "langchain-core>=0.3",
    "langchain-chroma>=0.2",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "reportlab", "ruff>=0.11,<1"]
telegram = ["aiogram>=3.31,<4"]
vk = ["vkbottle>=4.11,<5"]
messengers = ["aiogram>=3.31,<4", "vkbottle>=4.11,<5"]
office = ["openpyxl>=3.1,<4", "python-pptx>=1,<2"]
# Эмбеддеры — опциональны, чтобы не тянуть тяжёлые torch/transformers
# (huggingface) или langchain-community (infinity) в деплойменты, которые
# используют только один из двух. См. botkit/rag/embeddings.py.
huggingface = ["langchain-huggingface>=0.1", "sentence-transformers>=3.0"]
infinity = ["langchain-community>=0.3"]
progress = ["tqdm>=4.60"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
