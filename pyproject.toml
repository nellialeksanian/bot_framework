[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "botkit"
version = "0.1.0"
description = "Каркас фреймворка для сборки образовательных ботов на базе LLM — по спецификации docs/Модули фреймворка — приоритет.md"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nltk>=3.8",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "chromadb>=1.0",
    "langchain-core>=0.3",
    "langchain-chroma>=0.2",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "reportlab"]
# Эмбеддеры — опциональны, чтобы не тянуть тяжёлые torch/transformers
# (huggingface) или langchain-community (infinity) в деплойменты, которые
# используют только один из двух. См. botkit/rag/embeddings.py.
huggingface = ["langchain-huggingface>=0.1", "sentence-transformers>=3.0"]
infinity = ["langchain-community>=0.3"]
progress = ["tqdm>=4.60"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
